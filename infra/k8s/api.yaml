apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: email-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/email-classifier-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: email-classifier-config
            - secretRef:
                name: email-classifier-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: email-classifier
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-data
  namespace: email-classifier
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
