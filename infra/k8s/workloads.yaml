apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: email-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/email-classifier-api:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: email-classifier-config
            - secretRef:
                name: email-classifier-secrets
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: email-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/example/email-classifier-api:latest
          command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: email-classifier-config
            - secretRef:
                name: email-classifier-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: email-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/email-classifier-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: email-classifier
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-classifier
  namespace: email-classifier
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["mail.example.com"]
      secretName: email-classifier-tls
  rules:
    - host: mail.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /fetch-emails
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /filter-emails
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /emails
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /get-categories
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /rules
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
